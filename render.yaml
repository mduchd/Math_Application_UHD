services:
  - type: web
    name: kid-elearning-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build:api
    preDeployCommand: npm run db:push
    startCommand: npm run start:prod --workspace=apps/api
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
